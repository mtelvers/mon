syntax = "proto3";

// Minimal subset of Prometheus remote-write v1 (prompb), enough to push
// samples. See github.com/prometheus/prometheus/prompb/remote.proto.
package prometheus;

message Sample {
  double value = 1;
  int64 timestamp = 2; // milliseconds since epoch
}

message Label {
  string name = 1;
  string value = 2;
}

message TimeSeries {
  repeated Label labels = 1;  // must be sorted by name, include __name__
  repeated Sample samples = 2;
}

message WriteRequest {
  repeated TimeSeries timeseries = 1;
}
