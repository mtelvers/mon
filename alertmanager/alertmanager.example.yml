# Copy to alertmanager.yml. The Slack webhook is read from a file
# (alertmanager/slack_url, gitignored) so no secret lives in this committed
# config — see slack_url.example.

route:
  receiver: slack
  group_by: ["alertname", "target"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_url
        channel: "#alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }} ({{ .Alerts | len }}): {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts -}}
          *{{ .Labels.severity | toUpper }}* — {{ .Annotations.summary }}
          {{ end }}
